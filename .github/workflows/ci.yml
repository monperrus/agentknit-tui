name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    # NOTE: no windows — the `agentknit` dependency imports `readline`,
    # which is not available on Windows Python.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[test]" ruff

      - name: Ruff
        run: python -m ruff check agentknit_tui/ tests/

      - name: Test
        run: python -m pytest -q --cov=agentknit_tui --cov-report=term-missing

      - name: Build dist
        run: |
          python -m pip install build
          python -m build
