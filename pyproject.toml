[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentknit-tui"
version = "0.1.0"
description = "Textual TUI front-end for agentknit coding agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "agentknit contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agentknit>=0.2.0,<1",
    "textual>=0.86",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/monperrus/agentknit-tui"
Repository = "https://github.com/monperrus/agentknit-tui"
Issues = "https://github.com/monperrus/agentknit-tui/issues"
Changelog = "https://github.com/monperrus/agentknit-tui/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-cov>=4"]

[project.scripts]
agentknit-tui = "agentknit_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentknit_tui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
